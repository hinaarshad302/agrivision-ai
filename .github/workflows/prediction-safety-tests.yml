name: Prediction Safety Tests

on:
  push:
    branches:
      - feature/all-crop-safe-upload-2026-11-04
    paths:
      - "config.py"
      - "services/**"
      - "tests/**"
      - ".github/workflows/prediction-safety-tests.yml"
  pull_request:
    paths:
      - "config.py"
      - "services/**"
      - "tests/**"
      - ".github/workflows/prediction-safety-tests.yml"

jobs:
  prediction-safety-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "pillow>=10.0"

      - name: Run prediction safety tests
        run: python -m unittest discover -s tests -v
